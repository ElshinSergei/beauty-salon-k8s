apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: user-service-vs
spec:
  hosts:
    - user-service # Внутри Mesh достаточно имени сервиса
  http:
    - route:
        - destination:
            host: user-service
            port:
              number: {{ .Values.userService.service.port }}
      timeout: {{ .Values.userService.virtualService.timeout }}
      retries:
        attempts: {{ .Values.userService.virtualService.retries.attempts }}
        perTryTimeout: {{ .Values.userService.virtualService.retries.perTryTimeout }}
        retryOn: gateway-error,connect-failure,refused-stream