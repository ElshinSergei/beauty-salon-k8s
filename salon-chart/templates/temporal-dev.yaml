apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal
  template:
    metadata:
      labels:
        app: temporal
    spec:
      containers:
        - name: temporal
          image: temporalio/temporal:latest
          command: ["/bin/sh", "-c"]
          args: ["temporal server start-dev --ip 0.0.0.0"]
          ports:
            - containerPort: 7233 # GRPC
            - containerPort: 8233 # UI
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: default
spec:
  ports:
    - port: 7233
      name: grpc
      targetPort: 7233
    - port: 8233
      name: ui
      targetPort: 8233
  selector:
    app: temporal