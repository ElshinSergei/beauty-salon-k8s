apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: {{ .Values.userService.replicaCount }}
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: {{ .Values.userService.image.repository }}:{{ .Values.userService.image.tag }}
          imagePullPolicy: Never
          ports:
            - containerPort: {{ .Values.userService.service.port }}
          # Тут можно добавить env, livenessProbe и т.д.