{{- if .Values.gateway.enabled }}

apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: salon-gateway
spec:
  selector:
    istio: ingressgateway # использует стандартный ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - {{ .Values.gateway.host | quote }}

---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: gateway-vs
spec:
  hosts:
    - "*"
  gateways:
    - salon-gateway
  http:
    # Маршрут для Temporal UI
    - match:
        - uri:
            prefix: "/temporal"
      rewrite:
        uri: "/" # Temporal UI ждет запросы на корень, а мы идем по /temporal
      route:
        - destination:
            host: temporal # Имя вашего Service Temporal
            port:
              number: 8233

    # Маршрут для пользователей
    - match:
        - uri:
            prefix: "/api/users"
      route:
        - destination:
            host: user-service
            port:
              number: {{ .Values.userService.service.port }}

    # Маршрут для бронирований
    - match:
        - uri:
            prefix: "/api/booking"
      route:
        - destination:
            host: booking-service
            port:
              number: {{ .Values.bookingService.service.port }}

    # Маршрут для уведомлений
    - match:
        - uri:
            prefix: "/api/notifications"
      route:
        - destination:
            host: notification-service
            port:
              number: {{ .Values.notificationService.service.port }}

        # Маршрут для Temporal UI
    {{- end }}

