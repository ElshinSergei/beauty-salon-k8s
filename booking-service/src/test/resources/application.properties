# Отключаем кеширование для тестов
spring.cache.type=none
# Отключаем RabbitMQ для тестов (чтобы не было ошибок UnknownHost)
spring.rabbitmq.enabled=false

# ВАЖНО: заставляем Hibernate создать схему
spring.jpa.hibernate.ddl-auto=create-drop
# На всякий случай выводим SQL в лог, чтобы видеть создание таблиц
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Настройки БД
spring.datasource.url=jdbc:postgresql://localhost:5432/booking_db
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

testcontainers.enabled=true